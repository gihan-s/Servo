<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inputs</title>

    <link rel="stylesheet" href="assets/css/main.css">
    <link rel="stylesheet" href="assets/css/elements.css">
    <link rel="stylesheet" href="assets/css/GridTemplates.css">
    <script src="assets/js/elements.js" defer></script>
</head>

<body>

    <h2>Text Field</h2>

    <div class="input-grid-2">

        <div class="text-container">
            <div class="label text-label">First Name</div>
            <input type="text" class="text-field" name="" id="">
        </div>

        <div class="text-container">
            <div class="label text-label label-float">Last Name</div>
            <input type="text" class="text-field" value="Gihan" name="" id="">
        </div>

    </div>


    <h2>Dropdown</h2>

    <div class="input-grid-2">

        <div class="select-container">

            <div class="text-container">
                <div class="label dropdown-label">Work Type</div>
                <input type="text" class="text-field-dropdown" readonly name="" id="">
            </div>


            <div class="options">
                <div>Full Time</div>
                <div>Part Time</div>
                <div>Other</div>
            </div>
        </div>


        <div class="select-container">

            <div class="text-container">
                <div class="label dropdown-label label-float">Work Type</div>
                <input type="text" class="text-field-dropdown" value="Full Time" readonly name="" id="">
            </div>


            <div class="options">
                <div>Full Time</div>
                <div>Part Time</div>
                <div>Other</div>
            </div>
        </div>


    </div>

</body>

</html>

<style>
    body {
        padding: 25px;
    }

    h2 {
        margin-bottom: 15px;
        margin-top: 25px;
    }


    h2:first-child {
        margin-top: 0px;
    }
</style>
