name: 🚀 SFTP Deploy to VPS (prod branch)

on:
  push:
    branches:
      - prod-new  # your branch name

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v3

      - name: 🔧 Install sshpass
        run: sudo apt-get update && sudo apt-get install -y sshpass

      - name: 📤 Deploy via rsync over SSH with password
        env:
          VPS_PASSWORD: ${{ secrets.VPS_PASSWORD }}  # GitHub secret
        run: |
          REMOTE_USER="${{ secrets.VPS_USERNAME }}"
          REMOTE_HOST="${{ secrets.VPS_HOST }}"
          REMOTE_PORT="${{ secrets.VPS_PORT }}"       # optional, default 22
          REMOTE_PATH="${{ secrets.VPS_REMOTE_PATH }}" # destination folder

          echo "Deploying to $REMOTE_USER@$REMOTE_HOST:$REMOTE_PATH"

          sshpass -p "$VPS_PASSWORD" rsync -avz -e "ssh -p $REMOTE_PORT -o StrictHostKeyChecking=no" ./ $REMOTE_USER@$REMOTE_HOST:$REMOTE_PATH

          echo "Deployment complete."
